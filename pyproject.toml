[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa-compressor"
version = "0.1.0"
description = "Ultra-Fast Manhwa & Comic Compression Engine (CBZ & PDF) with SIMD Acceleration and L3-Cache Tiling"
readme = "README.md"
authors = [
    { name = "Jayprakash Pal", email = "jaypal24202899@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Compression"
]
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pymupdf>=1.23.0"
]

[project.urls]
Homepage = "https://github.com/jaypal1046/manhwa-compressor"
Repository = "https://github.com/jaypal1046/manhwa-compressor"
Issues = "https://github.com/jaypal1046/manhwa-compressor/issues"

[project.scripts]
manhwa-compress = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
